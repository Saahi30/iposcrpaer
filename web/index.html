<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPO Desk — Live issues & GMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <p class="brand-mark">IPO Desk</p>
        <p class="brand-tag">Open & upcoming issues with grey-market pulse</p>
      </div>
      <div class="meta" id="meta">
        <span class="meta-dot" aria-hidden="true"></span>
        <span id="scrapedAt">Loading…</span>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Filters">
        <div class="search-wrap">
          <label class="sr-only" for="search">Search IPOs</label>
          <input
            id="search"
            type="search"
            placeholder="Search company, exchange, manager…"
            autocomplete="off"
          />
        </div>

        <div class="chips" role="group" aria-label="Status">
          <button type="button" class="chip is-active" data-status="all">All</button>
          <button type="button" class="chip" data-status="open">Open</button>
          <button type="button" class="chip" data-status="upcoming">Upcoming</button>
        </div>

        <div class="chips" role="group" aria-label="Type">
          <button type="button" class="chip is-active" data-type="all">All types</button>
          <button type="button" class="chip" data-type="mainboard">Mainboard</button>
          <button type="button" class="chip" data-type="sme">SME</button>
        </div>

        <div class="counts" id="counts" aria-live="polite"></div>
      </section>

      <section class="board" aria-label="IPO list">
        <div class="board-head" aria-hidden="true">
          <span>Company</span>
          <span>Price</span>
          <span>GMP</span>
          <span>Sub</span>
          <span>Lot</span>
          <span>Timeline</span>
          <span></span>
        </div>
        <div id="list" class="list"></div>
        <p id="empty" class="empty hidden">No IPOs match these filters.</p>
      </section>
    </main>

    <footer class="foot">
      <p>
        Data from
        <a href="https://www.chittorgarh.com/" target="_blank" rel="noopener">Chittorgarh</a>.
        GMP is unofficial and not investment advice.
      </p>
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>

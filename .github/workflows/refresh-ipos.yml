name: Refresh IPO site

on:
  schedule:
    # Every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Required for GitHub Pages deploy via Actions.
# One-time setup (required or deploy fails with 404):
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
#   https://github.com/Saahi30/iposcrpaer/settings/pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-ipo-site
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape open & upcoming IPOs (with details)
        run: |
          python scrape_chittorgarh.py \
            --status open,upcoming \
            --details \
            --out output/ipos.json \
            --split \
            --out-dir output

      - name: Scrape IPO calendar + timetable
        run: |
          python scrape_calendar_timetable.py \
            --months 2 \
            --calendar-out output/ipo-calendar.json \
            --timetable-out output/ipo-timetable.json

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output web/data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes"
          else
            git commit -m "chore: refresh IPO data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: scrape
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
